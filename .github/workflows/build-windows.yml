name: Build Windows installer
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    env:
      CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Download ffmpeg + DeepFilterNet (bundled into the app)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip ffx
          Copy-Item (Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin\ffmpeg.exe
          Invoke-WebRequest "https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-pc-windows-msvc.exe" -OutFile bin\deep-filter.exe
          Get-ChildItem bin
      - name: Self-test the audio engine and Auto Clean analyser
        run: |
          python tests/test_dsp.py bin\ffmpeg.exe
          python tests/test_analyzer.py
          python tests/test_fx.py
          python tests/test_jsfx.py
          python tests/test_project.py
          python tests/test_mixer.py
          python tests/test_interchange.py
      - name: Build app folder
        run: pyinstaller --noconfirm MHous3.spec
      - name: Sign the program (only when a certificate is configured)
        if: env.CERT_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $st.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\MHous3 Audio Studio\MHous3 Audio Studio.exe"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\mhous3.iss
      - name: Sign the installer (only when a certificate is configured)
        if: env.CERT_PFX != ''
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $st.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 installer_output\MHous3-Audio-Studio-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MHous3-Audio-Studio-Setup
          path: installer_output/MHous3-Audio-Studio-Setup.exe
